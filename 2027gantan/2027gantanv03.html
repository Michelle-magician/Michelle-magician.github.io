      <!-- ----------------------------------------------------------------------- -->
      <!--                                 Canvas                                  -->

      // Canvasのサイズをブラウザの画面サイズに合わせる関数
      function resizeCanvas() {
        // 内部解像度（描画サイズ）を現在の画面幅に合わせる
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // サイズ変更後に再描画する処理（例: 背景を黒、真ん中に円を描画）
        // 背景クリア
        const gradient = ctx.createLinearGradient(0, 0, 200, 200);
        gradient.addColorStop(0, "red"); // 開始の色
        gradient.addColorStop(0.5, "yellow"); // 中間の色
        gradient.addColorStop(1, "blue"); // 終了の色
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = canvas.height / 25;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
      }
      // ページ読み込み時と、画面サイズ変更（リサイズ）時に実行する
      window.addEventListener("load", resizeCanvas);
      window.addEventListener("resize", resizeCanvas);

      // 影
      function setShadow(
        color = "rgba(0, 0, 0, 0.5)",
        blur = 10,
        offsetX = 5,
        offsetY = 5,
      ) {
        ctx.shadowColor = color; // 影の色 (rgbaがおすすめ)
        ctx.shadowBlur = blur; // 影のぼかし（数値が大きいほど広がる）
        ctx.shadowOffsetX = offsetX; // 横方向のズレ（右にプラス）
        ctx.shadowOffsetY = offsetY; // 縦方向のズレ（下にプラス）
      }

      // 影リセット
      function resetShadow() {
        ctx.shadowColor = "transparent"; // 透明にする
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }

      //images
      function changecolor(img, color = { r: 0, g: 0, b: 0 }) {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");

        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;

        tempCtx.drawImage(img, 0, 0);
        const imageData = tempCtx.getImageData(
          0,
          0,
          tempCanvas.width,
          tempCanvas.height,
        );
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          if (data[i] >= 255 && data[i + 1] >= 255 && data[i + 2] >= 255) {
            data[i] = color.r;
            data[i + 1] = color.g;
            data[i + 2] = color.b;
          }
        }
        tempCtx.putImageData(imageData, 0, 0);
        return tempCanvas;
      }

      // -- UI --
      // Box
      class Box {
        constructor(type = "normal", show, title = "title", content) {
          ((this.type = type), (this.title = title));
          this.content = content;
          this.alpha = 0.0;
          this.show = show;
          this.x = 0.0;
          this.y = 0.0;
          this.w = canvas.width;
          this.h = canvas.height;
        }
        update(deltaTime, op, value = 0, size = 1) {
          switch (op) {
            case "add":
              if (this.alpha >= 0 && this.alpha <= 1.0) {
                this.alpha += value * deltaTime * 60;
              }
              if (this.alpha > 1.0) {
                this.alpha = 1.0;
              }
              if (this.alpha < 0) {
                this.alpha = 0;
              }
              break;
          }
          switch (this.type) {
            case "normal":
              this.x =
                canvas.height * 0.05 +
                ((canvas.width - canvas.height * 0.1) / 2) * (1 - this.alpha);
              this.y =
                canvas.height * 0.05 +
                ((canvas.height * 0.9) / 2) * (1 - this.alpha);
              this.w = (canvas.width - canvas.height * 0.1) * this.alpha;
              this.h = canvas.height * 0.9 * this.alpha;
              break;
          }
          this.r = canvas.height * 0.02 - this.x;
          if (this.r < canvas.height * 0.02) {
            this.r = canvas.height * 0.02;
          }
          ctx.fillStyle = "rgba(255,255,255," + this.alpha / 2 + ")";
          ctx.beginPath;
          ctx.roundRect(this.x, this.y, this.w, this.h, this.r);
          ctx.fill();
          ctx.closePath;
          this.content(this.alpha);
        }
      }
      var boxes = [new Box("normal", "contact", "contact", JMldraw)];

      // Button
      class Button {
        constructor(x, y, cont, show, text = "", Bsize = 1.0) {
          this.x = x;
          this.y = y;
          if (text === "") {
            this.text = cont;
          } else {
            this.text = text;
          }
          this.Bsize = Bsize;
          this.cont = cont;
          this.show = show;
          this.alpha = 1.0;
          this.lsize = canvas.height * this.Bsize;
          if (this.show !== gamestate) {
            this.alpha = 0;
          }
        }
        update(deltaTime, op, value = 0, size = 1) {
          switch (op) {
            case "add":
              if (this.cont !== gamestate && value < 0) {
                this.alpha = 0;
                break;
              }
              if (this.alpha >= 0 && this.alpha <= 1.0) {
                this.alpha += value * deltaTime * 60;
              }
              if (this.alpha > 1.0) {
                this.alpha = 1.0;
              }
              if (this.alpha < 0) {
                this.alpha = 0;
              }
              break;
          }
          this.lsize = canvas.height * this.alpha ** 2 * this.Bsize;
          ctx.fillStyle = "rgba(200,200,200," + this.alpha + ")";
          ctx.beginPath();
          ctx.roundRect(
            canvas.width * this.x - this.lsize / 6 - this.lsize / 26,
            canvas.height * this.y - this.lsize / 26,
            this.lsize / 3 + this.lsize / 13,
            this.lsize / 13,
            this.lsize / 26,
          );
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255," + this.alpha ** 2 + ")";
          ctx.lineWidth = canvas.height / 200;
          ctx.beginPath();
          ctx.roundRect(
            canvas.width * this.x - this.lsize / 6 - this.lsize / 36,
            canvas.height * this.y - this.lsize / 36,
            this.lsize / 3 + this.lsize / 18,
            this.lsize / 18,
            this.lsize / 36,
          );
          ctx.stroke();
          ctx.closePath();
          // フォントの設定
          ctx.font = `${(this.lsize * this.Bsize) / 13}px "audiowide"`;
          // 水平方向の中央揃え
          ctx.textAlign = "center";
          // 垂直方向の中央揃え
          ctx.textBaseline = "middle";
          ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
          ctx.fillText(
            this.text,
            canvas.width / 2,
            canvas.height * this.y + (canvas.height / 150) * this.Bsize,
          );
        }
        checkClick(x, y, downX, downY) {
          if (
            this.alpha > 0.5 &&
            x > canvas.width * this.x - this.lsize / 6 - this.lsize / 26 &&
            x < canvas.width * this.x + this.lsize / 6 + this.lsize / 26 &&
            y > canvas.height * this.y - this.lsize / 26 &&
            y < canvas.height * this.y + this.lsize / 26 &&
            downX > canvas.width * this.x - this.lsize / 6 - this.lsize / 26 &&
            downX < canvas.width * this.x + this.lsize / 6 + this.lsize / 26 &&
            downY > canvas.height * this.y - this.lsize / 26 &&
            downY < canvas.height * this.y + this.lsize / 26
          ) {
            gamestate = this.cont;
          }
        }
      }

      class RenderObject {
        constructor(
          type,
          x,
          y,
          w,
          h,
          angle,
          z,
          resource,
          { r, g, b },
          { sr, sg, sb },
        ) {
          this.type = type;
          this.x = x;
          this.y = y;
          this.w = w;
          this.h = h;
          this.angle = angle;
          this.z = z;
          this.resource = resource;
          this.color = { r, g, b };
          this.scolor = { sr, sg, sb };
          this.time = 1.0;
          this.easing = "";
          this.v = 1.0;
          this.animation = [x, y, w, h, angle, z, { r, g, b }, { sr, sg, sb }];
        }
        drawCameraScene(Deltatime) {
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.scale(camera.zoom, camera.zoom);
          ctx.translate(-camera.x, -camera.y);
            /*const [
              type,
              x,
              y,
              w,
              h,
              angle,
              z,
              resource,
              { r: r, g: g, b: b },
              { sr: sr, sg: sb, sb: sg },
            ] = obj;
            const [
              time,

              v,
              [
                tox,
                toy,
                tow,
                toh,
                toangle,
                toz,
                { tor, rog, rob },
                { tosr, tosg, tosb },
              ],
            ] = toobj;*/
            if (this.type === "ccimg" && (!this.resource || !this.resource.complete)) {
              ctx.restore();
              return;
            }
            ctx.translate(camera.x * (1 - this.z) + this.x, camera.y * (1 - this.z) + this.y);
            if (this.angle !== 0) {
              ctx.rotate((this.angle * Math.PI) / 180);
            }

            switch (this.type) {
              case "ccimg":
                ctx.drawImage(
                  changecolor(this.resource, { r: this.color.r, g: this.color.g, b: this.color.b }),
                  -this.w / 2,
                  -(((this.w * this.resource.height) / this.resource.width) * this.h) / 2,
                  this.w,
                  ((this.w * this.resource.height) / this.resource.width) * this.h,
                );
                break;
              case "img":
                break;
              case "rr":
                ctx.beginPath();
                ctx.fillStyle = "white";
                ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 0.0);
                ctx.fill();
                ctx.closePath();
                break;
            }
          ctx.restore();
        }
      }

      let lastTime = 0;

        if (!lastTime) lastTime = timeStamp; // 初回のみlastTimeを初期化
        let deltaTime = (timeStamp - lastTime) / 1000; // ms単位に変換
        if (isNaN(deltaTime) || deltaTime < 0) deltaTime = 0;
        lastTime = timeStamp;

        //-- 背景 --
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const gradient = ctx.createLinearGradient(
          canvas.width / 2,
          0,
          canvas.width / 2,
          canvas.height,
        );
        gradient.addColorStop(0.21, "rgb(142,186,233)"); // 開始の色
        gradient.addColorStop(0.46, "rgb(255,247,253)"); // 中間の色
        gradient.addColorStop(0.85, "rgb(255,142,142)"); // 終了の色
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = canvas.height / 25;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        if (logoIsizeBstate > 0) {
          if (
            ((logoI.width * canvas.height) / 2500) * 1.1 <
            canvas.width + canvas.height / 900
          ) {
            ctx.drawImage(
              logoI,
              (canvas.width -
                ((logoI.width * canvas.height) / 2500) *
                  (1 + Math.sqrt(logoIsize) / 5) *
                  Math.sqrt(logoIsizeBstate)) /
                2,
              (canvas.height -
                ((logoI.height * canvas.height) / 2500) *
                  (1 + logoIsize ** 2 / 5) *
                  Math.sqrt(logoIsizeBstate)) /
                2 -
                canvas.height / 4,
              ((logoI.width * canvas.height) / 2500) *
                (1 + Math.sqrt(logoIsize) / 5) *
                Math.sqrt(logoIsizeBstate),
              ((logoI.height * canvas.height) / 2500) *
                (1 + Math.sqrt(logoIsize) / 5) *
                Math.sqrt(logoIsizeBstate),
            );
          } else {
            ctx.drawImage(
              logoI,
              (canvas.width -
                (canvas.width * 0.8 + canvas.height / 900) *
                  (1 + Math.sqrt(logoIsize) / 5)) /
                2,
              (canvas.height -
                ((logoI.height * canvas.height) / 2500) *
                  (1 + logoIsize ** 2 / 5)) /
                2 -
                canvas.height / 4,
              (canvas.width * 0.8 + canvas.height / 900) *
                (1 + Math.sqrt(logoIsize) / 5),
              ((logoI.height * canvas.height) / 2500) *
                (1 + Math.sqrt(logoIsize) / 5),
            );
          }
        }

        <!-- -------------------------- game main objects -------------------------- -->
        for(var n of renderobjects){
          n.drawCameraScene(deltaTime);
        }

        <!-- ----------------------------- animations ------------------------------ -->
        for (var n of boxes) {
          if (n.show === gamestate) {
            n.update(deltaTime, "add", 0.06);
          } else {
            n.update(deltaTime, "add", -0.06);
          }
        }
        for (var n of buttons) {
          if (n.show === gamestate) {
            n.update(deltaTime, "add", 0.06);
          } else {
            n.update(deltaTime, "add", -0.06);
          }
        }

        // -- mouse animation --
        touchParticles.forEach((p) => p.update(deltaTime));
        touchParticles = touchParticles.filter((p) => p.life > 0);
        dragParticles.forEach((p) => p.update(deltaTime));
        dragParticles = dragParticles.filter((p) => p.life > 0);
        clickParticles.forEach((p) => p.update(deltaTime));
        clickParticles = clickParticles.filter((p) => p.life > 0);
        //hover
        if (gamestate === "title") {
          if (logoIsizeBstate < 1) {
            logoIsizeBstate += (150 * deltaTime) / 60;
          }
          logoIsize -= (150 * deltaTime) / 60;
          if (logoIsize < 0) {
            logoIsize = 0;
          }
        } else {
          if (logoIsizeBstate > 0) {
            logoIsizeBstate -= (150 * deltaTime) / 60;
          }
        }
        if (gamestate == "start") {
          if (isPointerDown == true) {
            camera.zoom += 0.1;
            if (camera.zoom > 2.0) {
              camera.zoom = 2.0;
            }
          } else {
            camera.zoom -= 0.1;
            if (camera.zoom < 1.0) {
              camera.zoom = 1.0;
            }
          }
        }

        requestAnimationFrame(gameLoop);
      };

      <!-- ----------------------------------------------------------------------- -->
      <!--                                 events                                  -->
      <!-- ----------------------------------------------------------------------- -->
      //-- pointer event --
      //  menndoi
      var pointerdownpos = { x: 0, y: 0 };
      let isPointerDown = false;
      const getCanvasCoord = (event) => {
        const rect = canvas.getBoundingClientRect();
        const CanvasX = event.clientX - rect.left;
        const CanvasY = event.clientY - rect.top;
        return {
          x: CanvasX * (canvas.width / rect.width),
          y: CanvasY * (canvas.height / rect.height),
        };
      };
      var outtouch = false;
      canvas.addEventListener("pointerdown", (event) => {
        isPointerDown = true;
        const rect = canvas.getBoundingClientRect();
        mouseX = event.clientX - rect.left;
        mouseY = event.clientY - rect.top;
        if (
          mouseX > (canvas.width - (logoI.width * canvas.height) / 2500) / 2 &&
          mouseX <
            (canvas.width - (logoI.width * canvas.height) / 2500) / 2 +
              (logoI.width * canvas.height) / 2500 &&
          mouseY >
            (canvas.height - (logoI.height * canvas.height) / 2500) / 2 -
              canvas.height / 4 &&
          mouseY <
            (canvas.height - (logoI.height * canvas.height) / 2500) / 2 -
              canvas.height / 4 +
              (logoI.height * canvas.height) / 2500
        ) {
          logoIsize += 0.5;
          if (logoIsize > 1.2) {
            logoIsize = 1.2;
          }
        }
        const pos = getCanvasCoord(event);
        outtouch = false;
        pointerdownpos = { x: pos.x, y: pos.y };
        touchParticles.push(new touchParticle(pos.x, pos.y));
      });
      var frompos = { x: 0, y: 0 };
      canvas.addEventListener("pointermove", (event) => {
        const pos = getCanvasCoord(event);
        const rect = canvas.getBoundingClientRect();
        mouseX = event.clientX - rect.left;
        mouseY = event.clientY - rect.top;
        //drag
        if (isPointerDown) {
          if (
            outtouch === true ||
            Math.hypot(pos.x - pointerdownpos.x, pos.y - pointerdownpos.y) >
              canvas.height / 30
          ) {
            dragParticles.push(
              new dragParticle(frompos.x, frompos.y, pos.x, pos.y),
            );
            outtouch = true;
          }
          frompos = { x: pos.x, y: pos.y };
        }
      });
      const pointerUpHandler = (event) => {
        const pos = getCanvasCoord(event);
        const rect = canvas.getBoundingClientRect();
        mouseX = event.clientX - rect.left;
        mouseY = event.clientY - rect.top;
        for (var n of buttons) {
          if (n.show !== gamestate) continue;
          n.checkClick(pos.x, pos.y, pointerdownpos.x, pointerdownpos.y);
        }
        clickParticles.push(new clickParticle(pos.x, pos.y));
        touchParticles.splice(0, touchParticles.length);
        dragParticles.splice(0, dragParticles.length);
        isPointerDown = false;
      };
      window.addEventListener("pointerup", pointerUpHandler);
      window.addEventListener("pointercancel", () => {
        isPointerDown = false;
      });
      window.addEventListener("load", () => {
        loading();
        resizeCanvas();
      });

      gameLoop();
    </script>
  </body>
</html>
