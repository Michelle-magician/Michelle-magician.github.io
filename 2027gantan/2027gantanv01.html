<!doctype html>
<html lang="ja">
  <head>
    <meta
      charset="UTF-8"
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>2027 未は日の出を見られるか！？</title>
    <style>
      /* 画面の不要な余白を消し、スクロールバーが出ないようにする */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* スクロールバーを完全に非表示に */
      }

      /* canvasを画面全体に固定配置する */
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: block; /* 謎の隙間（インライン要素の隙間）を消す */
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      <!-- ----------------------------------------------------------------------- -->
      <!--                                 Canvas                                  -->
      <!-- ----------------------------------------------------------------------- -->
      // Canvasのサイズをブラウザの画面サイズに合わせる関数
      function resizeCanvas() {
        // 内部解像度（描画サイズ）を現在の画面幅に合わせる
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // サイズ変更後に再描画する処理（例: 背景を黒、真ん中に円を描画）
        // 背景クリア
        const gradient = ctx.createLinearGradient(0, 0, 200, 200);
        gradient.addColorStop(0, "red"); // 開始の色
        gradient.addColorStop(0.5, "yellow"); // 中間の色
        gradient.addColorStop(1, "blue"); // 終了の色
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = canvas.height / 25;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
      }
      // ページ読み込み時と、画面サイズ変更（リサイズ）時に実行する
      window.addEventListener("load", resizeCanvas);
      window.addEventListener("resize", resizeCanvas);

      <!-- ----------------------------------------------------------------------- -->
      <!--                                 Classes                                 -->
      <!-- ----------------------------------------------------------------------- -->
      //gamestate
      var gamestate = "title";

      //Button
      class Button {
        constructor(x, y, cont, show) {
          this.x = x;
          this.y = y;
          this.cont = cont;
          this.show = show;
          this.alpha = 1.0;
          this.lsize = canvas.height;
        }
        update(deltaTime, op, value = 0, size = 1) {
          switch (op){
            case "add":if(this.cont !== gamestate && value < 0){this.alpha = 0; break;}; if(this.alpha >= 0 && this.alpha <= 1){ this.alpha += (value*deltaTime*60)}; if(this.alpha > 1) this.alpha = 1; if(this.alpha < 0) this.alpha = 0; break;
          }
          this.lsize = canvas.height * (this.alpha**2);
          ctx.fillStyle = 'rgba(200,200,200,' + (this.alpha) + ')';
          ctx.fillRect(
            canvas.width * this.x - this.lsize / 6,
            canvas.height * this.y - this.lsize / 26,
            this.lsize / 3,
            this.lsize / 13,
          );
          ctx.beginPath();
          ctx.arc(
            canvas.width * this.x - this.lsize / 6,
            canvas.height * this.y,
            this.lsize / 26,
            -Math.PI*3/2,
            -Math.PI/2,
          );
          ctx.fill();
          ctx.beginPath();
          ctx.arc(
            canvas.width * this.x + this.lsize / 3 - this.lsize / 6,
            canvas.height * this.y,
            this.lsize / 26,
            Math.PI*3/2,
            Math.PI/2,
          );
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,' + (this.alpha ** 2) + ')';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(
            canvas.width * this.x - this.lsize / 6,
            canvas.height * this.y + this.lsize / 35,
          );
          ctx.arc(
            canvas.width * this.x - this.lsize / 6,
            canvas.height * this.y,
            this.lsize / 35,
            Math.PI / 2,
            (Math.PI * 3) / 2,
          );
          ctx.lineTo(
            canvas.width * this.x + this.lsize / 3 - this.lsize / 6,
            canvas.height * this.y - this.lsize / 35,
          );
          ctx.arc(
            canvas.width * this.x + this.lsize / 3 - this.lsize / 6,
            canvas.height * this.y,
            this.lsize / 35,
            -Math.PI / 2,
            Math.PI / 2,
          );
          ctx.lineTo(
            canvas.width * this.x - this.lsize / 6,
            canvas.height * this.y + this.lsize / 35,
          );
          ctx.stroke();
          ctx.closePath();
        }
      }

      var buttons = [
        new Button(0.5, 0.6, "start", "title"),
        new Button(0.5, 0.75, "contact", "title"),
      ];

      <!-- ----------------------------------------------------------------------- -->
      <!--                                gameloop                                 -->
      <!-- ----------------------------------------------------------------------- -->
      let lastTime = 0;
      const gameLoop = (timeStamp) => {
        //-- 時間制御 準備 --
        if (!lastTime) lastTime = timeStamp; // 初回のみlastTimeを初期化
        let deltaTime = (timeStamp - lastTime)/1000; // ms単位に変換
        lastTime = timeStamp;


        //-- 背景 --
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const gradient = ctx.createLinearGradient(
          canvas.width / 2,
          0,
          canvas.width / 2,
          canvas.height,
        );
        gradient.addColorStop(0.21, "rgb(142,186,233)"); // 開始の色
        gradient.addColorStop(0.46, "rgb(255,247,253)"); // 中間の色
        gradient.addColorStop(0.85, "rgb(255,142,142)"); // 終了の色
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "white";
        ctx.lineWidth = canvas.height / 25;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        //-- animations --
        for (var n of buttons) {
          if (n.show == gamestate) {
            n.update(deltaTime, "",0);
          } else {
            n.update(deltaTime, "add",-0.08);
          }
        }

        requestAnimationFrame(gameLoop);
      };

      //-- click event --
      // 「click」と「touchend」の両方で動く共通の関数を作る
      const handleSelect = (event) => {
        // スマホのダブルタップズームやスクロールなどの余計な挙動をここで止める
        if (event.type === "touchend") {
          event.preventDefault();
        }

        // 指で触った（タッチ）か、マウスでクリックしたかでイベントを分岐
        const e = event.changedTouches ? event.changedTouches[0] : event;

        const rect = canvas.getBoundingClientRect();

        // 座標の計算（引き算 ＋ 比率の補正）
        const canvasX = e.clientX - rect.left;
        const canvasY = e.clientY - rect.top;
        const mouseX = canvasX * (canvas.width / rect.width);
        const mouseY = canvasY * (canvas.height / rect.height);

        // ─── ボタン判定 ───
        for (var n of buttons) {
          if (n.show !== gamestate) continue;

          if (
            mouseX >= canvas.width * n.x - canvas.height / 6 &&
            mouseX <=
              canvas.width * n.x - canvas.height / 6 + canvas.height / 3 &&
            mouseY >= canvas.height * n.y - canvas.height / 26 &&
            mouseY <=
              canvas.height * n.y - canvas.height / 26 + canvas.height / 13
          ) {
            if (n.cont === "start") gamestate = "start";
            if (n.cont === "contact") gamestate = "contact";
          }
        }
      };

      // PC向けとスマホ向け、両方のイベントに同じ関数を登録する
      window.addEventListener("click", handleSelect, { passive: false });
      window.addEventListener("touchend", handleSelect, { passive: false });

      gameLoop();
    </script>
  </body>
</html>
